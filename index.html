<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14171c">
  <title>Push-Up Counter</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <script src="script.js"></script>
</head>
<body>
  <canvas id="js-confetti" class="confetti-canvas" aria-hidden="true"></canvas>

  <main class="app">
    <header class="app-header">
      <h1 class="app-title typing">Push-Up Counter</h1>
      <p class="app-subtitle typed">Keep your phone upright. Front and side camera views are supported.</p>
    </header>

    <section class="camera-card" aria-label="Live camera preview">
      <div class="camera-square">
        <div class="camera-stage" id="js-stage">
          <video id="js-video" playsinline muted autoplay aria-label="Live camera feed"></video>
          <canvas id="js-overlay" aria-hidden="true"></canvas>
        </div>
        <div class="camera-message" id="js-message" role="status" aria-live="polite">Loading...</div>
      </div>
      <p class="camera-guidance">Place the phone in front of you or at your side. Keep your shoulders, elbows and wrists visible.</p>
    </section>

    <section class="counter-card" aria-label="Push-up progress">
      <div class="counter-numbers" aria-live="polite">
        <span class="counter-count" id="js-count">0</span>
        <span class="counter-sep">/</span>
        <span class="counter-target" id="js-target">0</span>
      </div>
      <div class="progress" role="progressbar" aria-label="Goal progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-bar" id="js-progress-bar"></div>
      </div>
      <p class="status" id="js-status">Loading model...</p>
    </section>

    <section class="controls" aria-label="Workout controls">
      <button class="btn btn-primary" id="js-start" disabled>Start</button>
      <button class="btn" id="js-reset" type="button">Reset</button>
      <button class="btn" id="js-switch-camera" type="button">Switch camera</button>
      <button class="btn change" id="js-change-target" type="button">Change goal</button>
    </section>

    <footer class="app-footer">
      <p class="debug" id="js-debug"></p>
    </footer>
    <footer class="copyright">© 2026 Liron Aytek. All rights reserved.</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
  <script src="typing.js"></script>
</body>
</html>
